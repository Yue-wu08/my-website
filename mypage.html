<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a Web Page Interactive</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312454a'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23e08a3c'%3EM%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --primary: #12454a;
      --primary-dark: #0c2e32;
      --accent: #e08a3c;
      --paper: #f5f3ed;
      --ink: #16201d;
      --muted: #566862;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd8cc;
      border-radius: 16px;
      box-shadow: 0 12px 34px rgba(18, 46, 50, 0.1);
      padding: 48px 40px;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .card p {
      color: var(--muted);
      margin-top: 0;
    }

    /* Step 2: the heading we will change with JavaScript */
    #myHeading {
      font-size: 2.2rem;
      color: var(--primary-dark);
      margin: 10px 0 28px;
      transition: color 0.25s ease;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Step 3: the button */
    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 26px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:active { transform: translateY(1px); }

    #myButton {
      background: var(--primary);
      color: var(--paper);
    }

    #myButton:hover { background: var(--accent); color: #fff; }

    /* Bonus step 9: second button */
    #resetButton {
      background: #e7e2d6;
      color: var(--primary-dark);
    }

    #resetButton:hover { background: var(--line); }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main class="card">
    <p>My first interactive web page</p>

    <!-- Step 2: add a heading -->
    <h1 id="myHeading">Welcome!</h1>

    <!-- Step 3: add a button -->
    <div class="buttons">
      <button id="myButton" type="button">Click Me</button>
      <!-- Bonus step 9: second button that changes it back -->
      <button id="resetButton" type="button">Change Back</button>
    </div>
  </main>

  <!-- Step 4: script section placed right before </body> -->
  <script>
    // Step 5: use document.getElementById to find the elements
    const heading = document.getElementById("myHeading");
    const button = document.getElementById("myButton");
    const resetButton = document.getElementById("resetButton");

    // Store the original values so the second button can restore them
    const originalText = "Welcome!";
    const originalColor = "#0c2e32";

    // Step 6 & 7: listen for 'click' events, then change the heading text
    button.addEventListener("click", function () {
      heading.textContent = "Boom! The page is alive!";

      // Bonus step 8: change the heading colour too
      heading.style.color = "#e08a3c";
    });

    // Bonus step 9: the second button changes everything back
    resetButton.addEventListener("click", function () {
      heading.textContent = originalText;
      heading.style.color = originalColor;
    });
  </script>

</body>
</html>
